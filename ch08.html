<script>window.QUIZ={"id": "ch08", "q": [{"q": "What are Security Context Constraints (SCCs)?", "o": ["A security mechanism that limits a running pod&#x27;s access to the host environment", "A mechanism that controls which users can log in", "A quota on CPU and memory", "A type of NetworkPolicy for pods"], "a": 0, "e": "SCC 是 OpenShift 的安全機制，限制執行中的 Pod 對 Host 環境的存取；如同 RBAC 控制使用者，SCC 控制 Pod。"}, {"q": "Which of the following does an SCC control?", "o": ["Running privileged containers, using host directories as volumes, and changing the user ID", "Route TLS termination", "Helm release history", "Image stream tags"], "a": 0, "e": "SCC 控制執行 Privileged Container、要求額外 Capability、使用 Host 目錄作為 Volume、變更 SELinux Context、變更使用者 ID，以及使用 Host 的 Namespace 與網路。"}, {"q": "Why might an image from a public registry fail to start under the default SCC?", "o": ["It is not signed by Red Hat", "It requires a specific user ID or listens on a port below 1024, such as 80 or 443", "It uses too much memory", "It does not have a Route"], "a": 1, "e": "有些 Image 要求特定使用者 ID，或監聽小於 1024 的 Port，在隨機使用者 ID 下無法啟動。"}, {"q": "Which SCC do most pods use by default?", "o": ["nonroot", "restricted-v2", "anyuid", "privileged"], "a": 1, "e": "大多數 Pod 使用 restricted-v2，它限制對外部資源的存取，並以隨機使用者 ID 執行，所有已驗證的使用者預設可用。"}, {"q": "How does a pod run under the restricted-v2 SCC with respect to user IDs?", "o": ["As user ID 1000", "With a random user ID; running as root is not allowed", "Always as root", "As the user who created the Deployment"], "a": 1, "e": "restricted-v2 以隨機使用者 ID 執行，不允許以 root 執行或存取 Host 資源。"}, {"q": "Which SCC has a &#x27;Run as user&#x27; strategy of RunAsAny, allowing containers to run as any user ID including root?", "o": ["hostnetwork", "restricted-v2", "anyuid", "nonroot-v2"], "a": 2, "e": "anyuid 的 Run as user 策略為 RunAsAny，Container 可以任何使用者 ID 執行，包含 root。"}, {"q": "Which SCC removes most of the restrictions that OpenShift places on pods?", "o": ["anyuid", "restricted-v3", "privileged", "hostaccess"], "a": 2, "e": "privileged 移除 OpenShift 對 Pod 的大部分限制，Privileged Pod 可存取 Node 上任何資源。"}, {"q": "Why should you NOT modify the default SCCs?", "o": ["They are read-only and cannot be changed", "Modifying them deletes all pods", "Customizations can cause platform pods to fail to deploy, and upgrades can reset them", "They are stored in etcd backups only"], "a": 2, "e": "自訂預設 SCC 可能導致平台 Pod 部署失敗，或在升級時被重設；需要時請建立自己的 SCC。"}, {"q": "Which command lists all SCCs in the cluster?", "o": ["oc get scc", "oc describe pod --scc", "oc adm policy list-scc", "oc get securitycontext"], "a": 0, "e": "oc get scc 列出 Cluster 所有的 SCC；oc describe scc NAME 檢視優先順序、可用的使用者與群組及各項設定。"}, {"q": "Which pod annotation records the SCC that was actually applied to the pod?", "o": ["openshift.io/required-scc", "security.openshift.io/applied", "openshift.io/scc", "kubernetes.io/psp"], "a": 2, "e": "Pod 的註解記錄兩個值：openshift.io/required-scc 是 Workload 要求的 SCC，openshift.io/scc 是實際套用的 SCC；最常見兩者都是 restricted-v2。"}, {"q": "How does the admission process choose an SCC for a new pod?", "o": ["It always uses privileged", "It checks which SCCs the pod&#x27;s service account can use and selects one that satisfies the pod&#x27;s requirements", "It uses the SCC of the user who logged in to the console", "It picks an SCC at random"], "a": 1, "e": "Pod 建立時，系統依其 Service Account 可使用的 SCC 進行准入檢查，挑選符合需求的 SCC，並記錄在 Pod 註解中。"}, {"q": "Which command evaluates which SCCs can overcome the restrictions of a Deployment?", "o": ["oc get deploy NAME -o yaml | oc adm policy scc-subject-review -f -", "oc describe scc --for deployment/NAME", "oc adm policy who-can use scc", "oc auth can-i use scc"], "a": 0, "e": "以 scc-subject-review 檢視可克服限制的 SCC，例如需要特定使用者的 Image 適用 anyuid。"}, {"q": "Who can assign SCCs to service accounts or remove them?", "o": ["Only cluster administrators", "Any developer with the edit role", "Any project administrator", "The service account itself"], "a": 0, "e": "只有 Cluster 管理員能指派或移除 SCC。"}, {"q": "In &#x27;oc adm policy add-scc-to-user anyuid -z gitlab-sa&#x27;, what does -z indicate?", "o": ["The user is a system user", "The command runs in dry-run mode", "The SCC is applied to all namespaces with zero restrictions", "The subject is a service account"], "a": 3, "e": "-z 表示 Service Account，命令會自動加上目前 Project 的 Service Account 前綴。"}, {"q": "What is the scope of the binding created by &#x27;oc adm policy add-scc-to-user&#x27;?", "o": ["Only the current pod", "Only the current project", "Only the current node", "Cluster-wide, because it creates a cluster role binding"], "a": 3, "e": "指派 SCC 的命令會建立 Cluster Role Binding，範圍為整個 Cluster。"}, {"q": "How can you limit a service account&#x27;s use of an SCC to a single project?", "o": ["Use add-scc-to-user with -n", "Create a Role with the use verb on the scc resource for that SCC name, and bind it with a RoleBinding in the project", "Add the required-scc annotation only", "Edit the SCC&#x27;s users list"], "a": 1, "e": "建立 Role (--verb use --resource scc --resource-name SCC)，再以 Role Binding Bind 到該 Namespace 的 Service Account，效果只限該 Project。"}, {"q": "Which verb must a Role grant on the scc resource to let a service account use an SCC?", "o": ["bind", "get", "escalate", "use"], "a": 3, "e": "以 RBAC 限定 SCC 範圍時，Role 要授與 use 動詞，資源為 scc，並指定 SCC 名稱。"}, {"q": "When least privilege is required, which way of granting an SCC does the course prefer?", "o": ["Granting privileged to the default service account", "A Role and RoleBinding scoped to the specific project", "A cluster role binding created by add-scc-to-user", "Modifying restricted-v2"], "a": 1, "e": "需要最小權限時，優先選擇以 Role 與 Role Binding 把 SCC 使用權限定在特定 Project。"}, {"q": "Which command assigns the service account gitlab-sa to the Deployment gitlab?", "o": ["oc set serviceaccount deployment/gitlab gitlab-sa", "oc create serviceaccount gitlab-sa --for deployment/gitlab", "oc patch sa gitlab-sa --deployment gitlab", "oc adm policy add-role-to-user gitlab-sa deployment/gitlab"], "a": 0, "e": "oc set serviceaccount deployment/NAME SA 變更 Deployment 的 Service Account，成功後相關 Pod 會重新部署。"}, {"q": "What does the openshift.io/required-scc annotation in a Deployment&#x27;s pod template do?", "o": ["Grants the SCC to the service account", "Creates the SCC if it does not exist", "Pins the SCC that the workload must use, preventing another SCC from being selected", "Records the SCC applied by admission"], "a": 2, "e": "required-scc 註解可固定 Workload 的 SCC，避免被其他 SCC 取代；SCC 必須存在且 Service Account 能使用，否則准入失敗。"}, {"q": "Why should you not edit the openshift.io/required-scc annotation directly on a running pod?", "o": ["Admission fails; you should modify the Deployment so that pods are recreated", "It deletes the pod&#x27;s service account", "The annotation is ignored on pods", "It changes the SCC for the whole cluster"], "a": 0, "e": "不要直接修改執行中 Pod 的註解，否則准入會失敗；請修改 Deployment，讓 Pod 自動重新建立。"}, {"q": "What is the most common way to relax SCC restrictions for workloads?", "o": ["The anyuid SCC, because many images expect to run as a specific user such as root", "The privileged SCC", "Disabling SCC admission", "Using hostnetwork for all pods"], "a": 0, "e": "anyuid 是最常見的放寬方式，因為許多 Image 預期以特定使用者執行，例如 root。"}, {"q": "Which kinds of workloads might require the privileged SCC?", "o": ["Batch jobs that only call a public API", "Static websites", "Monitoring agents and log collectors that need host paths, network namespaces, or host processes", "Typical web front-ends"], "a": 2, "e": "監控代理程式、Log 收集器等可能需要 Host 路徑、網路 Namespace 或 Host 程序，通常使用 privileged SCC；只在絕對必要時才授與。"}, {"q": "In the SCC guided exercise, why does the GitLab pod enter an Error state?", "o": ["The image cannot be pulled", "The quota is exceeded", "It requires root privileges and cannot write to restricted directories", "Its route is missing"], "a": 2, "e": "GitLab 需要 root 權限，在預設 SCC 下 Container 無法寫入受限目錄而進入 Error；授與 anyuid 並指派 Service Account 後變為 Running。"}, {"q": "What is a service account in the context of Kubernetes API access?", "o": ["A cluster-wide role", "A secret containing a kubeconfig", "A human user with API access", "A Kubernetes object in a project that represents the identity of an application running in a pod"], "a": 3, "e": "Service Account 是 Project 內的 Kubernetes 物件，代表 Pod 內執行之應用程式的身分。"}, {"q": "What are the three steps to grant an application access to the Kubernetes API?", "o": ["Create a user, a group, and an identity", "Create a service account, grant it the appropriate API access, and assign it to the application&#x27;s pods", "Create a route, a secret, and a token", "Create a quota, a limit range, and a project"], "a": 1, "e": "授權步驟：建立應用程式的 Service Account；授與適當的 API 存取權；將 Service Account 指派給應用程式的 Pod。"}, {"q": "Which service account does a pod use when none is specified, and what permissions does it have?", "o": ["The builder service account, with edit permissions", "No service account; the pod cannot start", "The admin service account, with cluster-admin", "The default service account, which OpenShift grants no permissions"], "a": 3, "e": "Pod 未指定時使用 default Service Account；OpenShift 不授與任何權限，對大多數業務應用程式已足夠。"}, {"q": "Why does Red Hat not recommend granting extra permissions to the default service account?", "o": ["The default service account cannot hold roles", "It breaks the image registry", "It disables token mounting", "All pods in the same project would get those permissions"], "a": 3, "e": "授與 default Service Account 額外權限，同一 Project 的所有 Pod 都會取得，不符合最小權限。"}, {"q": "Which pod spec field specifies the service account?", "o": ["spec.containers[].serviceAccount", "metadata.annotations.serviceaccount", "spec.serviceAccountName", "spec.securityContext.serviceAccount"], "a": 2, "e": "在 Pod 定義的 spec.serviceAccountName 欄位指定 Service Account 名稱。"}, {"q": "Which of the following is an example of a controller that needs Kubernetes API access?", "o": ["A static NGINX web server", "Argo CD, which watches resources in a repository and updates the cluster", "A Redis cache", "A batch job that compresses files"], "a": 1, "e": "Controller 持續監看並使資源達到預期狀態，例如 Argo CD 的 Controller 監看 Repository 中的資源並更新 Cluster。"}, {"q": "What does the course warn about using a controller to update resources together with GitOps?", "o": ["Do not use both for the same changes, to avoid conflicts", "Controllers require GitOps to work", "GitOps disables all controllers", "Controllers must run in openshift-gitops"], "a": 0, "e": "以 Controller 更新資源是 GitOps 的替代做法；不要同時使用兩者處理相同的變更，以免衝突。"}, {"q": "In a Role or ClusterRole rule, what does an empty string in apiGroups represent?", "o": ["The OpenShift API group", "The core API group", "All API groups", "No API groups"], "a": 1, "e": "rules 的 apiGroups 以空字串表示核心 API，例如 secret-reader 規則的 resources 為 secrets、verbs 為 get、watch、list。"}, {"q": "What is the difference in scope between a Role and a ClusterRole?", "o": ["They are identical", "A Role grants permissions in a single namespace; a ClusterRole can grant permissions in a specific namespace or the entire cluster", "A Role is cluster-wide; a ClusterRole is namespaced", "A ClusterRole can only be bound to groups"], "a": 1, "e": "Role 在單一 Namespace 內授與權限；Cluster Role 可在特定 Namespace 或整個 Cluster 授與權限。"}, {"q": "Why might using the default edit cluster role for an application be too broad?", "o": ["It cannot read secrets", "It allows creating or updating most objects, not just reading secrets", "It grants cluster-admin", "It applies only to service accounts in openshift namespaces"], "a": 1, "e": "OpenShift 預設的 Cluster Role 權限較寬，例如 edit 除了讀取 Secret，也允許建立或更新大多數物件。"}, {"q": "Which command binds a cluster role to the service account SA in the current project only?", "o": ["oc adm policy add-cluster-role-to-user CLUSTER-ROLE -z SA", "oc adm policy add-role-to-user CLUSTER-ROLE -z SA", "oc adm policy add-scc-to-user CLUSTER-ROLE -z SA", "oc create clusterrolebinding --serviceaccount SA"], "a": 1, "e": "add-role-to-user 在目前 Project 建立 Role Binding；add-cluster-role-to-user 則建立 Cluster Role Binding，授與整個 Cluster 範圍。"}, {"q": "If you do not use the -z option when binding a role to a service account, how must you specify it?", "o": ["With serviceaccount/SA", "With SA@PROJECT", "With PROJECT/SA", "With the full reference system:serviceaccount:PROJECT:SA"], "a": 3, "e": "未使用 -z 時，需寫完整的 Service Account 參照 system:serviceaccount:PROJECT:SA。"}, {"q": "How does an application running in a pod obtain its service account token?", "o": ["It reads the kubeconfig of the node", "An administrator copies it into a ConfigMap", "The application must run oc create token", "The kubelet requests a token through the TokenRequest API and mounts it into the pod automatically"], "a": 3, "e": "kubelet 透過 TokenRequest API 為 Pod 的 Service Account 要求 Token，並自動 Mount 到 Pod。"}, {"q": "Where is the service account token mounted inside a pod?", "o": ["/etc/kubernetes/token", "/root/.kube/config", "/var/lib/kubelet/token", "/var/run/secrets/kubernetes.io/serviceaccount/token"], "a": 3, "e": "Pod 內自動 Mount 的路徑為 /var/run/secrets/kubernetes.io/serviceaccount/token。"}, {"q": "How does a process outside the cluster, such as a CI/CD pipeline, obtain a service account token?", "o": ["Run oc create token SA to request a short-lived token, valid for one hour by default", "Extract the token Secret, which never expires", "Read the token from the node", "Use the kubeadmin password"], "a": 0, "e": "Cluster 外的程序以 oc create token 手動要求短期 Token，預設有效一小時，可用 --duration 變更。"}, {"q": "On managed cloud services, what can OIDC token federation provide?", "o": ["A kubeadmin password", "Temporary cloud IAM credentials in exchange for the projected service account token", "Permanent static cloud credentials", "An htpasswd file"], "a": 1, "e": "受管理的雲端服務可用 OIDC Token Federation，把投射的 Service Account Token 換成暫時的雲端 IAM 認證，取代靜態認證資料。"}, {"q": "An application in project A must read Secrets in project B. Where should you create the RoleBinding?", "o": ["As a ClusterRoleBinding only", "In project A, where the service account is", "In project B, where the resources are, with the subject referencing the service account in project A", "In openshift-config"], "a": 2, "e": "跨 Project 時，Role Binding 建立在資源所在的 Project，Subject 參照另一個 Project 的 Service Account，格式為 system:serviceaccount:project:service-account。"}, {"q": "What is the effect of binding a ClusterRole with a RoleBinding (not a ClusterRoleBinding)?", "o": ["The permissions apply only within the RoleBinding&#x27;s namespace", "The permissions apply cluster-wide", "The ClusterRole is converted into a Role", "The binding is invalid"], "a": 0, "e": "Cluster Role 搭配 Role Binding 只授與該 Namespace 內的權限。"}, {"q": "What is the difference between a Job and a CronJob?", "o": ["They are the same resource", "A Job runs on a schedule; a CronJob runs once", "A Job runs a task once; a CronJob defines a schedule for creating Jobs from a template", "A CronJob runs only on control plane nodes"], "a": 2, "e": "Job 指定只執行一次的工作；Cron Job 定義執行 Job Template 的排程，到期時 Kubernetes 依 Template 建立 Job。"}, {"q": "What is the minimum that a Job&#x27;s pod template must specify?", "o": ["At least one container with an image and the command to run", "A service account and an SCC", "A persistent volume claim", "A schedule"], "a": 0, "e": "Job 含 Pod Template，至少要指定一個 Container、Image 與要執行的 command。"}, {"q": "If a CronJob does not specify the optional timeZone field, how is its schedule interpreted?", "o": ["In the time zone of the user who created it", "In the node&#x27;s BIOS time zone", "According to the local time zone of the controller manager", "Always in UTC"], "a": 2, "e": "timeZone 為選用；未指定時，依 Controller Manager 的本機時區解讀排程。"}, {"q": "What does the cron schedule &#x27;0 0 * * 7&#x27; mean?", "o": ["Every 7 minutes", "On the seventh day of every month", "Every day at midnight", "Every Sunday at midnight"], "a": 3, "e": "五個欄位依序為分、時、日、月、星期；星期 0 或 7 都是週日，所以是每週日午夜。"}, {"q": "Which cron schedule runs a job every four hours?", "o": ["0 0 */4 * *", "0 4 * * *", "*/4 * * * *", "0 */4 * * *"], "a": 3, "e": "0 */4 * * * 表示每四小時執行；*/4 * * * * 是每四分鐘；0 4 * * * 是每天凌晨四點。"}, {"q": "In the wordpress-backup CronJob example, why are the commands in args separated by semicolons?", "o": ["Semicolons mark comments", "Semicolons start a new container", "Semicolons are required by Kubernetes", "The YAML folded style converts line breaks into spaces, so the commands run on a single line"], "a": 3, "e": "args 使用 YAML 折疊樣式 (&gt;)，換行轉為空白，搭配 bash -xc 等同在單一行執行多個命令，因此各命令以分號分隔。"}, {"q": "In the cluster maintenance example, how does the script prune unused images on every node?", "o": ["It deletes all image streams", "It reboots every node", "It runs oc debug on each node, uses chroot /host, and runs crictl rmi --prune", "It runs oc adm prune images in every namespace"], "a": 2, "e": "ConfigMap 中的指令碼列出所有 Node，逐一以 oc debug 執行 Debug Pod，以 chroot 存取 Node 根 Filesystem，再執行 crictl rmi --prune。"}, {"q": "In the image-pruning exercise, why does the first CronJob run fail?", "o": ["The default service account cannot list nodes", "The schedule syntax is invalid", "The ConfigMap is not mounted", "The origin-cli image does not exist"], "a": 0, "e": "使用 default Service Account 時 Cron Job 無法列出 Node，Pod 進入 Error；建立專用 Service Account 並授與所需 SCC 與角色後 Job 才完成。"}]};</script>
<script>
const D=window.QUIZ, L='ABCD', KEY='do280-v422-'+D.id;
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){st={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const M=document.getElementById('qs');
D.q.forEach((q,i)=>{
  const s=document.createElement('section');s.className='q';s.id='q'+(i+1);
  s.innerHTML=`<h2><span class="n">Q${i+1}.</span><span lang="en">${q.q}</span></h2>
  <ul class="opts">${q.o.map((o,j)=>`<li><label><input type="radio" name="r${i}" value="${j}"><span class="k">${L[j]}.</span><span lang="en">${o}</span></label></li>`).join('')}</ul>
  <div class="act"><button class="btn primary show-ans">查看答案與說明</button><span class="badge"></span></div>
  <div class="ans"><div class="v"></div><p>${q.e}</p></div>`;
  M.appendChild(s);
  s.querySelectorAll('input').forEach(r=>r.addEventListener('change',()=>{st[i]={c:+r.value,r:st[i]&&st[i].r};save();paint(i,false)}));
  s.querySelector('.show-ans').addEventListener('click',()=>{st[i]=st[i]||{};st[i].r=1;save();paint(i,true)});
});
function paint(i,scroll){
  const q=D.q[i],s=document.getElementById('q'+(i+1)),x=st[i]||{};
  const labels=s.querySelectorAll('label');
  labels.forEach((lb,j)=>{lb.classList.remove('chosen','right','wrong');lb.querySelector('input').checked=(x.c===j);if(x.c===j)lb.classList.add('chosen')});
  const a=s.querySelector('.ans'),b=s.querySelector('.badge'),btn=s.querySelector('.show-ans');
  if(x.r){
    labels[q.a].classList.add('right');
    if(x.c!==undefined&&x.c!==q.a)labels[x.c].classList.add('wrong');
    a.classList.add('show');a.classList.toggle('x',x.c!==undefined&&x.c!==q.a);
    a.querySelector('.v').textContent=(x.c===undefined?'正確答案：':x.c===q.a?'答對了！正確答案：':'答錯了。正確答案：')+L[q.a]+'. '+strip(q.o[q.a]);
    b.textContent=x.c===undefined?'未作答':x.c===q.a?'✔ 正確':'✘ 錯誤';b.className='badge '+(x.c===q.a?'ok':x.c===undefined?'':'bad');
    btn.textContent='隱藏答案';btn.onclick=()=>{st[i].r=0;save();paint(i)};
  }else{
    a.classList.remove('show');b.textContent='';btn.textContent='查看答案與說明';
    btn.onclick=()=>{st[i]=st[i]||{};st[i].r=1;save();paint(i)};
  }
  stats();
}
function strip(h){const t=document.createElement('div');t.innerHTML=h;return t.textContent}
function stats(){
  let done=0,rev=0,ok=0;D.q.forEach((q,i)=>{const x=st[i]||{};if(x.c!==undefined)done++;if(x.r&&x.c!==undefined){rev++;if(x.c===q.a)ok++}});
  document.getElementById('done').textContent=done;document.getElementById('ok').textContent=ok;document.getElementById('rev').textContent=rev;
  document.querySelector('.prog i').style.width=(done/D.q.length*100)+'%';
}
document.getElementById('checkAll').onclick=()=>{
  D.q.forEach((q,i)=>{st[i]=st[i]||{};st[i].r=1});save();D.q.forEach((q,i)=>paint(i));
  let ok=0,un=0;D.q.forEach((q,i)=>{if(st[i].c===undefined)un++;else if(st[i].c===q.a)ok++});
  const s=document.getElementById('sum');s.classList.add('show');
  s.innerHTML=`<b>成績：${ok} / ${D.q.length} (${Math.round(ok/D.q.length*100)}%)</b><br>答錯 ${D.q.length-ok-un} 題，未作答 ${un} 題。可按「只看答錯」複習。`;
  try{const b=JSON.parse(localStorage.getItem('do280-v422-best')||'{}');if(!b[D.id]||ok>b[D.id]){b[D.id]=ok;localStorage.setItem('do280-v422-best',JSON.stringify(b))}}catch(e){}
  s.scrollIntoView({behavior:'smooth',block:'center'});
};
document.getElementById('reset').onclick=()=>{if(!confirmReset())return;st={};save();document.getElementById('sum').classList.remove('show');filt=0;applyFilter();D.q.forEach((q,i)=>paint(i));window.scrollTo(0,0)};
let armed=0;function confirmReset(){const b=document.getElementById('reset');if(armed){armed=0;b.textContent='重新作答';return true}armed=1;b.textContent='再按一次確認清除';setTimeout(()=>{armed=0;b.textContent='重新作答'},3000);return false}
let filt=0;document.getElementById('wrongOnly').onclick=()=>{filt=!filt;applyFilter()};
function applyFilter(){const b=document.getElementById('wrongOnly');b.textContent=filt?'顯示全部題目':'只看答錯';
  D.q.forEach((q,i)=>{const x=st[i]||{};const w=x.r&&x.c!==undefined&&x.c!==q.a;document.getElementById('q'+(i+1)).classList.toggle('hide',!!filt&&!w)})}
D.q.forEach((q,i)=>paint(i));
</script>
</body></html>
