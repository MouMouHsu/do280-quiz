數量。"}, {"q": "In &#x27;oc describe template&#x27; output, what does a parameter&#x27;s Value field represent?", "o": ["A value that cannot be changed", "The encrypted value of a Secret", "The default value, which can be overridden at deployment", "The value currently used in the cluster"], "a": 2, "e": "參數的 Value 是預設值，部署時可以覆寫。"}, {"q": "A parameter shows &#x27;Generated: expression&#x27; and &#x27;From: [a-zA-Z0-9]{16}&#x27;. What does this mean?", "o": ["A default value is generated from the expression, such as a random 16-character password", "The value must be entered by the user in that format or deployment fails", "The parameter is read from a file named [a-zA-Z0-9]{16}", "The parameter is deprecated"], "a": 0, "e": "Generated 與 From 欄位依表達式自動產生參數的預設值，例如隨機產生 16 個字元的密碼。"}, {"q": "Where do the &#x27;Object Labels&#x27; defined in a template get applied?", "o": ["Only to pods", "To the namespace", "Only to the template resource itself", "To every resource that the template creates"], "a": 3, "e": "Object Labels 會套用到 Template 建立的所有 Resource。"}, {"q": "Which command shows the parameters that a template uses?", "o": ["oc get template TEMPLATE --params", "oc explain template.parameters", "oc describe parameters TEMPLATE", "oc process --parameters TEMPLATE"], "a": 3, "e": "oc process --parameters 顯示 Template 使用的參數，包含名稱、產生方式與預設值；加 -f 可檢視檔案中的 Template 參數。"}, {"q": "How can you view the parameters of a template defined in a local file named my-postgresql.yaml?", "o": ["oc get template -f my-postgresql.yaml --parameters", "oc process --parameters -f my-postgresql.yaml", "oc describe -f my-postgresql.yaml --values", "helm show values my-postgresql.yaml"], "a": 1, "e": "以 -f 選項可檢視檔案中定義的 Template 參數。"}, {"q": "Which command retrieves the full YAML manifest of the postgresql-ephemeral template?", "o": ["oc process postgresql-ephemeral --export", "oc extract template/postgresql-ephemeral", "oc describe template postgresql-ephemeral -o yaml", "oc get template postgresql-ephemeral -o yaml -n openshift"], "a": 3, "e": "oc get template NAME -o yaml 取得 Template Manifest，可看出 Template 如何建立 Resource，也適合用來學習撰寫 Template。"}, {"q": "Which approach does the course recommend for deploying a template to production?", "o": ["Use oc new-app --template directly in production", "Process the template into manifests with oc process and then apply them with oc apply", "Use helm install with the template name", "Edit the template in the openshift namespace"], "a": 1, "e": "開發測試可用 oc new-app 一步建立；正式環境建議先以 oc process 產生 Manifest (可納入版本控制)，再用 oc apply 建立或更新。"}, {"q": "Which command deploys a template in one step, which is convenient for development and testing?", "o": ["oc new-app --template NAME -p KEY=VALUE", "oc get template NAME -o yaml", "oc process NAME | oc diff -f -", "oc create -f template.yaml"], "a": 0, "e": "oc new-app --template 搭配參數一步就建立並部署 Resource，適合開發測試。"}, {"q": "How do you set parameter values on the command line with oc process?", "o": ["--set KEY=VALUE", "-e KEY=VALUE", "-p KEY=VALUE", "--values KEY=VALUE"], "a": 2, "e": "oc process 以 -p 的 key=value 設定參數；--set 與 --values 是 Helm 的用法。"}, {"q": "Which oc process option reads parameter values from a file?", "o": ["--param-file", "--values", "--patch-file", "--from-env-file"], "a": 0, "e": "--param-file 從檔案讀取參數。參數多時比較整潔，而且參數檔可以存入版本控制，記錄正式環境使用的值。"}, {"q": "How can you deploy a processed template without writing an intermediate manifest file?", "o": ["Use oc create --template", "Pipe the output to oc apply -f -", "Use oc process -o cluster", "Use oc process --apply"], "a": 1, "e": "不必產生檔案，可直接把 oc process 的輸出以管線傳給 oc apply -f -。"}, {"q": "What permission do you need to process a template that is stored in a namespace?", "o": ["Only the view role", "No permission is needed", "cluster-admin", "Write permission in that namespace"], "a": 3, "e": "簡報指出，處理 Namespace 中的 Template 需要該 Namespace 的寫入權限。"}, {"q": "Before updating a template-based deployment with new parameters, how can you preview the changes?", "  has access to the shared-templates project"], "a": 3, "e": "上傳後，有該 Project 存取權的人都能使用這個 Template。"}, {"q": "What is Helm?", "o": ["An OpenShift operator that manages cluster updates", "A container registry", "A tool that only renders Kustomize overlays", "An open source application that manages the lifecycle of Kubernetes applications using charts"], "a": 3, "e": "Helm 是開源應用程式，用 Chart 管理 Kubernetes 應用程式的生命週期，包含安裝、升級與回復。"}, {"q": "According to the course, what should you consider for application lifecycles that are more complex than Helm can handle?", "o": ["Operators, which provide a more complete model", "Imperative oc commands", "Kustomize generators", "OpenShift templates"], "a": 0, "e": "Helm 無法涵蓋所有需求，更複雜的應用程式生命週期，Operator 有更完整的模型可以處理。"}, {"q": "Which file in a Helm chart stores metadata such as the chart name and version?", "o": ["templates/NOTES.txt", "values.yaml", "kustomization.yaml", "Chart.yaml"], "a": 3, "e": "Chart.yaml 記錄 Chart 名稱與 Version 等 Metadata；values.yaml 存放預設值；templates 目錄存放 Resource 定義。"}, {"q": "Which file in a Helm chart contains the default values?", "o": ["Chart.yaml", "defaults.env", "release.yaml", "values.yaml"], "a": 3, "e": "values.yaml 存放 Chart 的預設值，Chart Resource 預設使用這些值，你可以覆寫。"}, {"q": "What are chart hooks used for?", "o": ["Defining RBAC roles for Helm", "Connecting a chart repository to the web console", "Running actions at different stages of install and upgrade to automate tasks", "Signing chart packages"], "a": 2, "e": "Chart 可含 Hook，在安裝與升級的不同階段執行，自動化工作；使用前要先閱讀 Chart 文件，了解 Hook 的影響。"}, {"q": "What is a Helm release?", "o": ["The values.yaml file used for the installation", "A Git tag in the chart repository", "A new version of a chart published by its author", "The result of deploying a chart; the same chart can be deployed many times, each as a different release"], "a": 3, "e": "Release 是部署 Chart 的結果，同一 Cluster 可部署同一 Chart 多次，每次都是不同的 Release，需要唯一的名稱。Version 才是 Chart 作者釋出的版本。"}, {"q": "Which command shows general information rces in the cluster", "They change only the local configuration and do not affect cluster resources", "They install charts into the current namespace", "They delete releases from the cluster"], "a": 1, "e": "helm repo 子命令只改變本機設定，不影響 Cluster Resource。"}, {"q": "By default, what does &#x27;helm search repo&#x27; show, and how do you see every version?", "o": ["All versions; add --latest to see the newest", "Only installed charts; add --all to see available ones", "Only the latest version of each chart; add --versions to see all versions", "Only deprecated charts"], "a": 2, "e": "搜尋預設只顯示每個 Chart 的最新版本，加上 --versions 才會列出所有版本。"}, {"q": "A repository added with &#x27;helm repo add&#x27; does not appear in the web console. What is needed?", "o": ["Add the repository to values.yaml", "Restart the console pods", "Run helm repo update", "A cluster administrator must create a HelmChartRepository or ProjectHelmChartRepository custom resource"], "a": 3, "e": "helm repo add 加入的 Repository 只存在本機；要讓 Web Console 看到，需由 Cluster 管理員建立 HelmChartRepository 或 ProjectHelmChartRepository Custom Resource。"}, {"q": "Which URL protocols are supported when installing a Helm chart from a URL in the web console?", "o": ["ftp:// and http://", "file:// only", "https:// and oci://", "git:// and ssh://"], "a": 2, "e": "從 URL 安裝支援 https:// 與 oci:// 兩種協定。"}, {"q": "What is the risk of installing a chart from a URL in the web console?", "o": ["It cannot set custom values", "It requires deleting the existing release", "It bypasses the Software Catalog verification checks, so you should install only trusted URLs", "It always installs the oldest chart version"], "a": 2, "e": "從 URL 直接安裝會略過 Software Catalog 的驗證檢查，只能安裝你信任的來源。"}, {"q": "Which section of the web console Helm release details page shows the installation notes provided by the chart author?", "o": ["Revision History", "Resources", "Release Notes", "Details"], "a": 2, "e": "Release Notes 顯示 Chart 作者提供的安裝說明，類似 helm install 輸出的 NOTES。"}, {"q": "What   const s=document.createElement('section');s.className='q';s.id='q'+(i+1);
  s.innerHTML=`<h2><span class="n">Q${i+1}.</span><span lang="en">${q.q}</span></h2>
  <ul class="opts">${q.o.map((o,j)=>`<li><label><input type="radio" name="r${i}" value="${j}"><span class="k">${L[j]}.</span><span lang="en">${o}</span></label></li>`).join('')}</ul>
  <div class="act"><button class="btn primary show-ans">查看答案與說明</button><span class="badge"></span></div>
  <div class="ans"><div class="v"></div><p>${q.e}</p></div>`;
  M.appendChild(s);
  s.querySelectorAll('input').forEach(r=>r.addEventListener('change',()=>{st[i]={c:+r.value,r:st[i]&&st[i].r};save();paint(i,false)}));
  s.querySelector('.show-ans').addEventListener('click',()=>{st[i]=st[i]||{};st[i].r=1;save();paint(i,true)});
});
function paint(i,scroll){
  const q=D.q[i],s=document.getElementById('q'+(i+1)),x=st[i]||{};
  const labels=s.querySelectorAll('label');
  labels.forEach((lb,j)=>{lb.classList.remove('chosen','right','wrong');lb.querySelector('input').checked=(x.c===j);if(x.c===j)lb.classList.add('chosen')});
  const a=s.querySelector('.ans'),b=s.querySelector('.badge'),btn=s.querySelector('.show-ans');
  if(x.r){
    labels[q.a].classList.add('right');
    if(x.c!==undefined&&x.c!==q.a)labels[x.c].classList.add('wrong');
    a.classList.add('show');a.classList.toggle('x',x.c!==undefined&&x.c!==q.a);
    a.querySelector('.v').textContent=(x.c===undefined?'正確答案：':x.c===q.a?'答對了！正確答案：':'答錯了。正確答案：')+L[q.a]+'. '+strip(q.o[q.a]);
    b.textContent=x.c===undefined?'未作答':x.c===q.a?'✔ 正確':'✘ 錯誤';b.className='badge '+(x.c===q.a?'ok':x.c===undefined?'':'bad');
    btn.textContent='隱藏答案';btn.onclick=()=>{st[i].r=0;save();paint(i)};
  }else{
    a.classList.remove('show');b.textContent='';btn.textContent='查看答案與說明';
    btn.onclick=()=>{st[i]=st[i]||{};st[i].r=1;save();paint(i)};
  }
  stats();
}
function strip(h){const t=document.createElement('div');t.innerHTML=h;return t.textContent}
function stats(){
  let done=0,rev=0,ok=0;D.q.forEach((q,i)=>{const x=st[i]||{};if(x.c!==undefined)done++;if(x.r&&x.c!==undefined){rev++;if(x.c===q.a)ok++}});
  document.getElementById('done').textContent=done;document.getElementById('ok').textContent=ok;document.getElementById('rev').textContent=rev;
  document.querySelector('.prog i').style.width=(done/D.q.length*100)+'%';
}
document.getElementById('checkAll').onclick=()=>{
  D.q.forEach((q,i)=>{st[i]=st[i]||{};st[i].r=1});save();D.q.forEach((q,i)=>paint(i));
  let ok=0,un=0;D.q.forEach((q,i)=>{if(st[i].c===undefined)un++;else if(st[i].c===q.a)ok++});
  const s=document.getElementById('sum');s.classList.add('show');
  s.innerHTML=`<b>成績：${ok} / ${D.q.length} (${Math.round(ok/D.q.length*100)}%)</b><br>答錯 ${D.q.length-ok-un} 題，未作答 ${un} 題。可按「只看答錯」複習。`;
  try{const b=JSON.parse(localStorage.getItem('do280-v422-best')||'{}');if(!b[D.id]||ok>b[D.id]){b[D.id]=ok;localStorage.setItem('do280-v422-best',JSON.stringify(b))}}catch(e){}
  s.scrollIntoView({behavior:'smooth',block:'center'});
};
document.getElementById('reset').onclick=()=>{if(!confirmReset())return;st={};save();document.getElementById('sum').classList.remove('show');filt=0;applyFilter();D.q.forEach((q,i)=>paint(i));window.scrollTo(0,0)};
let armed=0;function confirmReset(){const b=document.getElementById('reset');if(armed){armed=0;b.textContent='重新作答';return true}armed=1;b.textContent='再按一次確認清除';setTimeout(()=>{armed=0;b.textContent='重新作答'},3000);return false}
let filt=0;document.getElementById('wrongOnly').onclick=()=>{filt=!filt;applyFilter()};
function applyFilter(){const b=document.getElementById('wrongOnly');b.textContent=filt?'顯示全部題目':'只看答錯';
  D.q.forEach((q,i)=>{const x=st[i]||{};const w=x.r&&x.c!==undefined&&x.c!==q.a;document.getElementById('q'+(i+1)).classList.toggle('hide',!!filt&&!w)})}
D.q.forEach((q,i)=>paint(i));
</script>
</body></html>
