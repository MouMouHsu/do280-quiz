ntity Provider。"}, {"q": "On ROSA and OpenShift Dedicated, how do you configure identity providers?", "o": ["By editing the kubeconfig file", "By creating an htpasswd Secret in openshift-config", "With the rosa or ocm CLI or the Hybrid Cloud Console, not with YAML", "By editing the OAuth resource with oc edit"], "a": 2, "e": "在 ROSA 與 OpenShift Dedicated 無法用 YAML 設定 Identity Provider，需改用 rosa、ocm 或 Hybrid Cloud Console；ARO 則與自管 Cluster 做法相同。"}, {"q": "Which two methods for administrator access does OpenShift create during installation?", "o": ["A GitHub OAuth app and a service account", "An htpasswd file and an LDAP bind user", "A cluster-admin group and a Secret", "A kubeconfig file and the kubeadmin virtual user"], "a": 3, "e": "安裝時會建立 kubeconfig 檔 (以 X.509 憑證驗證的 system:admin) 與 kubeadmin 虛擬使用者兩種管理驗證方式。"}, {"q": "Which user is represented by the certificate in the installer-generated kubeconfig file?", "o": ["system:admin", "system:anonymous", "admin", "kubeadmin"], "a": 0, "e": "kubeconfig 檔中憑證使用者為 system:admin，擁有最高權限，且不需要 Identity Provider。"}, {"q": "What should you confirm before deleting the kubeadmin user?", "o": ["That all projects have been deleted", "That the kubeconfig file has been deleted", "That no identity providers are configured", "That another user already has the cluster-admin role"], "a": 3, "e": "刪除 kubeadmin 之前，先確認已有其他使用者擁有 cluster-admin 角色。本課程環境則請勿刪除 kubeadmin。"}, {"q": "Which htpasswd option creates a new file?", "o": ["-D", "-c", "-B", "-b"], "a": 1, "e": "-c 建立新檔，只在第一次建立時使用；-B 以 bcrypt 雜湊；-b 從 Command-line 讀取密碼；-D 刪除使用者。"}, {"q": "Why should you NOT use the -c option when adding a second user to an existing htpasswd file?", "o": ["It disables bcrypt hashing", "It overwrites the existing file", "It requires interactive input", "It deletes the Secret"], "a": 1, "e": "-c 會建立新檔，若對既有檔案使用會覆蓋原檔，因此新增使用者時不加 -c。"}, {"q": "Which htpasswd option hashes the password with bcrypt?", "o": ["-c", "-B", "-m", "-b"], "a": 1, "e": "-B 以 bcrypt 雜湊密碼；小寫 -b 則是從 Command-line 讀取密碼。"}, {"q": "Which command removes the user developer from /tmp/htpasswd?", "o": ["oc delete user developer -f /tmp/htpasswd", "htpasswd -c /tmp/htpasswd developer", "htpasswd -r /tmp/htpasswd developer", "htpasswd -D /tmp/htpasswd developer"], "a": 3, "e": "htpasswd -D 從檔案刪除使用者。"}, {"q": "In which namespace must you create the Secret that holds the htpasswd file?", "o": ["kube-system", "default", "openshift-authentication", "openshift-config"], "a": 3, "e": "HTPasswd 的 Secret 建立在 openshift-config Namespace，再由 OAuth Custom Resource 參照。"}, {"q": "Which command creates the htpasswd Secret?", "o": ["oc create configmap htpasswd --from-file /tmp/htpasswd", "oc set data oauth/cluster --from-file /tmp/htpasswd", "oc create secret generic htpasswd-secret --from-file htpasswd=/tmp/htpasswd -n openshift-config", "oc create secret tls htpasswd-secret --cert /tmp/htpasswd"], "a": 2, "e": "以 oc create secret generic 並用 --from-file htpasswd=FILE 建立，key 名稱為 htpasswd，位於 openshift-config。"}, {"q": "In the OAuth custom resource, which field points the HTPasswd identity provider to the Secret?", "o": ["identityProviders.source", "spec.secretName", "htpasswd.secretRef", "htpasswd.fileData.name"], "a": 3, "e": "在 .spec.identityProviders 的 htpasswd 區段，以 fileData.name 指向 Secret 名稱。"}, {"q": "Which mappingMethod value does the course use for the HTPasswd identity provider?", "o": ["claim", "lookup", "generate", "add"], "a": 0, "e": "範例中 mappingMethod 設為 claim。"}, {"q": "After editing the exported oauth.yaml file, which command applies the change?", "o": ["oc create -f oauth.yaml", "oc process -f oauth.yaml", "oc patch -f oauth.yaml --local", "oc replace -f oauth.yaml"], "a": 3, "e": "簡報以 oc replace -f oauth.yaml 套用 OAuth 變更。"}, {"q": "Why must you wait after changing the HTPasswd configuration or Secret?", "o": ["The kubeconfig must be regenerated", "The nodes must be drained", "The API server must be rebooted", "The Authentication Operator redeploys the pods in openshift-authentication, and the old settings remain until then"], "a": 3, "e": "Authentication Operator 偵測到變更後會重新部署 openshift-authentication 的 Pod，通常需要幾分鐘，完成前舊設定仍然有效。"}, {"q": "Which command extracts the htpasswd file from the Secret so that you can modify it?", "o": ["oc cp secret/htpasswd-secret /tmp/", "oc get secret htpasswd-secret -o htpasswd", "oc extract secret/htpasswd-secret -n openshift-config --to /tmp/ --confirm", "oc describe secret htpasswd-secret --output-file /tmp/htpasswd"], "a": 2, "e": "oc extract 取出 Secret 的檔案資料，--confirm 允許覆寫目的地已存在的檔案。"}, {"q": "Which command writes the modified htpasswd file back to the Secret?", "o": ["oc set data secret/htpasswd-secret --from-file htpasswd=/tmp/htpasswd -n openshift-config", "oc patch oauth cluster --patch-file /tmp/htpasswd", "oc apply -f /tmp/htpasswd", "oc replace secret htpasswd-secret /tmp/htpasswd"], "a": 0, "e": "oc set data secret 把修改後的檔案寫回 Secret。"}, {"q": "You removed the user manager from the htpasswd file. What else must you do to delete the user completely?", "o": ["Nothing; the user is removed automatically", "Delete the OAuth resource", "Delete the identity (for example, myusers:manager) and the user resource", "Restart the API server"], "a": 2, "e": "光從檔案移除使用者不夠，Identity 與 User 資源仍然存在，還要執行 oc delete identity myusers:manager 與 oc delete user manager。"}, {"q": "What is the name format of the identity created for user manager from an identity provider named myusers?", "o": ["system:myusers:manager", "manager@myusers", "myusers:manager", "manager.myusers"], "a": 2, "e": "範例刪除 Identity 時使用 myusers:manager，即 Identity Provider 名稱加冒號加使用者名稱。"}, {"q": "Which command makes the user new_admin a cluster administrator?", "o": ["oc policy add-role-to-user admin new_admin", "oc create user new_admin --admin", "oc adm policy add-cluster-role-to-user cluster-admin new_admin", "oc adm groups add-users cluster-admin new_admin"], "a": 2, "e": "oc adm policy add-cluster-role-to-user cluster-admin 授予 Cluster 管理員角色。oc policy "}, {"q": "Which default role can manage all project resources, including granting access to other users?", "o": ["edit", "admin", "basic-user", "view"], "a": 1, "e": "admin 可管理 Project 的所有資源，含授予其他使用者存取權，也能管理 Quota 與限制。"}, {"q": "What can a user with the edit role NOT do?", "o": ["Create Deployments", "Modify ConfigMaps", "Delete Services", "Manage limit ranges, quotas, or project permissions"], "a": 3, "e": "edit 可建立、修改、刪除常見應用程式資源，但不能管理限制與 Quota，或 Project 權限。"}, {"q": "Which default role can view most objects in the cluster but cannot modify them?", "o": ["self-provisioner", "cluster-reader", "basic-user", "cluster-status"], "a": 1, "e": "cluster-reader 可檢視大多數物件但不能修改；cluster-status 只存取 Cluster 狀態資訊。"}, {"q": "Which group is the self-provisioner role bound to by default?", "o": ["system:authenticated:oauth", "system:cluster-admins", "system:authenticated", "system:serviceaccounts"], "a": 0, "e": "self-provisioner 預設 Bind 到 system:authenticated:oauth 群組，所以所有通過驗證的使用者都能建立 Project。"}, {"q": "On managed services, which role gives full access that bypasses the managed service protections and should be given only to a few platform architects?", "o": ["cluster-admins", "dedicated-admins", "cluster-reader", "self-provisioner"], "a": 0, "e": "託管服務的 cluster-admins 有完全存取並會略過託管服務的保護；dedicated-admins 只管理使用者建立的 Project，不能修改控制平面與核心 Operator。"}, {"q": "Which command grants the edit role to the group dev-group in the wordpress project?", "o": ["oc adm groups add-users dev-group edit", "oc adm policy add-cluster-role-to-group edit dev-group", "oc policy add-role-to-group edit dev-group -n wordpress", "oc policy add-role-to-user edit dev-group"], "a": 2, "e": "oc policy add-role-to-group 對群組授予 Project 內的角色，-n 指定 Project。"}, {"q": "If you omit the -n option with &#x27;oc policy add-role-to-user&#x27;, which project is used?", "o": ["The openshift project", "The current project", "The default project", "All projects"], "a": 1, "e": "以 -n 指定 Project；省略時使用目前的 Project。"}, {"q": "How do system user names typically begin?", "o": ["openshift:", "sys-", "kube-", "system:"], "a": 3, "e": "System User 多在基礎架構定義時自動建立，名稱以 system: 開頭，例如 system:admin。"}, {"q": "What prefix do service account user names have?", "o": ["system:sa:", "system:serviceaccount:namespace:", "serviceaccount/", "sa:namespace:"], "a": 1, "e": "Service Account 的名稱以 system:serviceaccount:namespace: 開頭。"}, {"q": "Which command creates a group named lead-developers?", "o": ["oc adm groups new lead-developers", "oc policy new-group lead-developers", "oc create group lead-developers --users", "oc adm policy add-group lead-developers"], "a": 0, "e": "oc adm groups new 建立 Group，oc adm groups add-users 把使用者加入 Group。"}, {"q": "In the RBAC guided exercise, qa-engineer can list Deployments but cannot scale them. Why?", "o": ["Scaling requires cluster-admin", "The qa-group has only the view role", "The qa-group has the edit role, which forbids scaling", "The Deployment has a quota"], "a": 1, "e": "練習中 qa-group 只被授予 view 角色，可以檢視 Deployment，但沒有修改權限，因此無法 scale。"}]};</script>

  const q=D.q[i],s=document.getElementById('q'+(i+1)),x=st[i]||{};
  const labels=s.querySelectorAll('label');
  labels.forEach((lb,j)=>{lb.classList.remove('chosen','right','wrong');lb.querySelector('input').checked=(x.c===j);if(x.c===j)lb.classList.add('chosen')});
  const a=s.querySelector('.ans'),b=s.querySelector('.badge'),btn=s.querySelector('.show-ans');
  if(x.r){
    labels[q.a].classList.add('right');
    if(x.c!==undefined&&x.c!==q.a)labels[x.c].classList.add('wrong');
    a.classList.add('show');a.classList.toggle('x',x.c!==undefined&&x.c!==q.a);
    a.querySelector('.v').textContent=(x.c===undefined?'正確答案：':x.c===q.a?'答對了！正確答案：':'答錯了。正確答案：')+L[q.a]+'. '+strip(q.o[q.a]);
    b.textContent=x.c===undefined?'未作答':x.c===q.a?'✔ 正確':'✘ 錯誤';b.className='badge '+(x.c===q.a?'ok':x.c===undefined?'':'bad');
    btn.textContent='隱藏答案';btn.onclick=()=>{st[i].r=0;save();paint(i)};
  }else{
    a.classList.remove('show');b.textContent='';btn.textContent='查看答案與說明';
    btn.onclick=()=>{st[i]=st[i]||{};st[i].r=1;save();paint(i)};
  }
  stats();
}
function strip(h){const t=document.createElement('div');t.innerHTML=h;return t.textContent}
function stats(){
  let done=0,rev=0,ok=0;D.q.forEach((q,i)=>{const x=st[i]||{};if(x.c!==undefined)done++;if(x.r&&x.c!==undefined){rev++;if(x.c===q.a)ok++}});
  document.getElementById('done').textContent=done;document.getElementById('ok').textContent=ok;document.getElementById('rev').textContent=rev;
  document.querySelector('.prog i').style.width=(done/D.q.length*100)+'%';
}
document.getElementById('checkAll').onclick=()=>{
  D.q.forEach((q,i)=>{st[i]=st[i]||{};st[i].r=1});save();D.q.forEach((q,i)=>paint(i));
  let ok=0,un=0;D.q.forEach((q,i)=>{if(st[i].c===undefined)un++;else if(st[i].c===q.a)ok++});
  const s=document.getElementById('sum');s.classList.add('show');
  s.innerHTML=`<b>成績：${ok} / ${D.q.length} (${Math.round(ok/D.q.length*100)}%)</b><br>答錯 ${D.q.length-ok-un} 題，未作答 ${un} 題。可按「只看答錯」複習。`;
  try{const b=JSON.parse(localStorage.getItem('do280-v422-best')||'{}');if(!b[D.id]||ok>b[D.id]){b[D.id]=ok;localStorage.setItem('do280-v422-best',JSON.stringify(b))}}catch(e){}
  s.scrollIntoView({behavior:'smooth',block:'center'});
};
document.getElementById('reset').onclick=()=>{if(!confirmReset())return;st={};save();document.getElementById('sum').classList.remove('show');filt=0;applyFilter();D.q.forEach((q,i)=>paint(i));window.scrollTo(0,0)};
let armed=0;function confirmReset(){const b=document.getElementById('reset');if(armed){armed=0;b.textContent='重新作答';return true}armed=1;b.textContent='再按一次確認清除';setTimeout(()=>{armed=0;b.textContent='重新作答'},3000);return false}
let filt=0;document.getElementById('wrongOnly').onclick=()=>{filt=!filt;applyFilter()};
function applyFilter(){const b=document.getElementById('wrongOnly');b.textContent=filt?'顯示全部題目':'只看答錯';
  D.q.forEach((q,i)=>{const x=st[i]||{};const w=x.r&&x.c!==undefined&&x.c!==q.a;document.getElementById('q'+(i+1)).classList.toggle('hide',!!filt&&!w)})}
D.q.forEach((q,i)=>paint(i));
</script>
</body></html>
