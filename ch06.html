pace"], "a": 1, "e": "OpenShift 會在受影響的 Namespace 建立 AppliedClusterResourceQuota，讓 Project 管理員檢視用量。"}, {"q": "Which limitation applies when listing AppliedClusterResourceQuota resources?", "o": ["It is available only in the web console", "You must specify a namespace; --all-namespaces is not supported", "It requires cluster-admin", "It shows only CPU usage"], "a": 1, "e": "AppliedClusterResourceQuota 要指定 Namespace 才能列出，不支援 --all-namespaces。"}, {"q": "In the guided exercise, a Deployment requesting one CPU per pod is scaled to eight replicas without a quota. What happens?", "o": ["Only two pods run and the rest stay Pending with FailedScheduling: Insufficient cpu", "All eight pods run", "The Deployment is rejected", "The pods run with zero CPU"], "a": 0, "e": "Node 的 Requests 已達約 87%，只有兩個 Pod 為 Running，其餘 Pending，Event 顯示 FailedScheduling：Insufficient cpu。"}, {"q": "In the guided exercise, after creating the one-cpu quota (requests.cpu=1), a new Deployment test-2 that does not request CPU fails. Why?", "o": ["test-2 uses an invalid image", "test-2 exceeds the pod count quota", "The namespace has a deny-all NetworkPolicy", "The quota requires every workload to specify requests.cpu"], "a": 3, "e": "設定運算 Quota 後必須指定 requests.cpu，未宣告的 test-2 因此建立失敗。"}, {"q": "What is a limit range?", "o": ["A role that limits user permissions", "A cluster-scoped object that limits the total CPU of the cluster", "A NetworkPolicy for port ranges", "A namespace-scoped object that defines limits for each workload in the namespace"], "a": 3, "e": "Limit Range 是 Namespace 範圍的物件，為每個 Workload 定義限制。"}, {"q": "Which object types can a limit range apply to?", "o": ["Containers, pods, images, image streams, and persistent volume claims", "Only nodes", "Only services and routes", "Only Deployments"], "a": 0, "e": "Limit Range 可套用到 Container、Pod、Image、Image Stream 與 Persistent Volume Claim。"}, {"q": "In a LimitRange, which field sets the default limits for containers that do not define them?", "o": ["defaultRequest", "max", "min", "default"], "a": 3, "e": "default 為預設的 Limits；defaultRequest 為預設的 Requests；max 與 min 為上下限。"}, {"q": "In a LimitRange, which field sets the default requests?", "o": ["defaultRequest", "minRequest", "requests", "default"], "a": 0, "e": "defaultRequest 是 Workload 的預設 Requests。"}, {"q": "What does the maxLimitRequestRatio (limit-to-request ratio) type control?", "o": ["The number of containers per pod", "The maximum ratio between a limit and a request, for example a ratio of 2 means the limit cannot exceed twice the request", "The ratio of pods to nodes", "The quota usage percentage"], "a": 1, "e": "Limit-to-request Ratio 限制 Limit 與 Request 的最大比例；例如比例為二，Limit 不能超過 Request 的兩倍 (本課程不介紹細節)。"}, {"q": "What is a risk of setting the maximum in a limit range too strictly?", "o": ["It disables the quota", "It removes default values", "It blocks legitimate workloads", "It allows workloads to exhaust the quota"], "a": 2, "e": "最大值可避免耗盡 Quota，但設得太嚴格會擋下正常的 Workload，應保留足夠彈性。"}, {"q": "Why are limit range defaults especially useful for workloads generated by CI tools?", "o": ["Defaults bypass quotas", "CI tools cannot run without a limit range", "Dynamically generated workloads may not define resources, and defaults ensure consistent allocation", "Defaults speed up the build process"], "a": 2, "e": "預設值適合 CI 工具這類動態產生、可能沒有定義資源的 Workload，可確保一致的資源配置。"}, {"q": "Which component applies limit range defaults and constraints?", "o": ["The admission controller in the API server, when pods are created", "The Scheduler", "The ReplicaSet controller", "The kubelet on each node"], "a": 0, "e": "Limit Range 由 API Server 的 Admission Controller 在建立 Pod 時套用。"}, {"q": "After a limit range is applied, the Deployment&#x27;s resources field is still empty but new pods have requests and limits. Why?", "o": ["The limit range failed", "The limit range modifies the pod&#x27;s containers, not the Deployment", "The Deployment is cached", "The web console hides the values"], "a": 1, "e": "Admission Controller 影響的是 Pod 的定義，不會修改 Deployment；練習也確認 Deployment 的 resources 仍是空的。"}, {"q": "You create a limit range in a namespace that already has running pods. What happens to those pods?", "o": ["They are evicted if they exceed the maximum", "They are restarted immediately with new limits", "They are not affected; new pods get the limits after the Deployment is recreated", "They are deleted"], "a": 2, "e": "Limit Range 不影響既有的 Pod；刪除並重新建立 Deployment 後，新 Pod 才會套用。"}, {"q": "A pod requests more memory than the limit range maximum. What happens?", "o": ["The pod is created with the maximum value", "The pod is created and throttled", "The pod is not created, and a warning event is recorded", "The Deployment is deleted"], "a": 2, "e": "超出 min 與 max 的 Pod 不會建立，並記錄警告事件。"}, {"q": "If a limit range specifies only min or max and no defaults, what does Kubernetes do?", "o": ["Copies the min or max value into default and defaultRequest", "Uses the cluster&#x27;s global defaults", "Rejects the limit range", "Leaves the containers without defaults"], "a": 0, "e": "只指定 min 或 max 時，Kubernetes 會複製其值補上 default 與 defaultRequest；建議明確指定，讓行為更可預測。"}, {"q": "Which relationship between limit range values is required?", "o": ["min ≥ defaultRequest ≥ default ≥ max", "defaultRequest ≥ default ≥ max ≥ min", "max ≥ default ≥ defaultRequest ≥ min", "default ≥ max ≥ min ≥ defaultRequest"], "a": 2, "e": "數值關係須符合：max 大於或等於 default；default 大於或等於 defaultRequest；defaultRequest 大於或等於 min。"}, {"q": "During a rolling update of a Deployment in a namespace with a quota, why might the update fail to complete?", "o": ["Pods from both the old and new ReplicaSets count against the quota, and the total can exceed it", "The old ReplicaSet is not deleted", "Rolling updates are not supported with quotas", "The limit range blocks image changes"], "a": 0, "e": "Rolling Update 時新舊 ReplicaSet 的 Pod 都計入 Quota，合計超過時更新無法完成。"}, {"q": "In the limit range guided exercise, the pod metrics show about 50 MiB of memory used while the default request is 256 MiB. What lesson does this illustrate?", "o": ["Defaults that are higher than actual needs can waste quota, so evaluate workload usage first", "The pod will be evicted", "The metrics are wrong", "The limit range is not working"], "a": 0, "e": "實際用量約 50 MiB，遠低於 Request，表示預設值高於實際需求會浪費 Quota；應先評估 Workload 的用量。"}, {"q": "Why does OpenShift introduce Project and ProjectRequest instead of letting users manage namespaces directly?", "o": ["Namespaces do not support quotas", "Kubernetes has no namespaces", "Namespaces cannot have labels", "Namespace metadata has security implications, and RBAC cannot allow listing only some namespaces"], "a": 3, "e": "Namespace 是 Cluster 範圍資源，修改其 Metadata 可能覆寫安全措施，RBAC 也無法只允許列出部分 Namespace；Project 與 ProjectRequest 讓使用者自助建立 Namespace 但不能修改其 Metadata。"}, {"q": "When a user lists projects, what does the API server do?", "o": ["Queries the identity provider", "Returns only the projects created by the user", "Returns all namespaces in the cluster", "Lists namespaces, filters the ones visible to the user, and returns them in project format"], "a": 3, "e": "列出 Project 時，API Server 列出 Namespace，過濾出使用者可見的部分，再以 Project 格式回傳。"}, {"q": "Which namespaced resources does the course suggest adding to a project template?", "o": ["Nodes and machine configs", "Operators and subscriptions only", "ClusterRoles and ClusterRoleBindings", "Roles and role bindings, resource quotas and limit ranges, and network policies"], "a": 3, "e": "任何 Namespace 範圍的資源都可加入；常見的是 Role 與 RoleBinding、ResourceQuota 與 LimitRange，以及 NetworkPolicy。"}, {"q": "Why does the course recommend adding a limit range whenever you add a quota to the project template?", "o": ["A quota does not work without a limit range", "A limit range replaces the admin role binding", "With a quota, workloads must declare limits, and a limit range supplies defaults to reduce that burden", "The template fails without a limit range"], "a": 2, "e": "加入 Quota 後，建立 Workload 需要宣告 Limits，建議一併加入 Limit Range 提供預設值。"}, {"q": "Which command generates an initial project template?", "o": ["oc new-project --template", "oc adm create-bootstrap-project-template -o yaml", "oc get template project-request -n openshift", "oc process project-request"], "a": 1, "e": "oc adm create-bootstrap-project-template 產生初始 Project Template，行為等同預設的 Project 建立，含 Project 與 admin RoleBinding。"}, {"q": "In which namespace must you create the project template resource?", "o": ["openshift-apiserver", "openshift-config", "default", "openshift"], "a": 1, "e": "Project Template 資源建立在 openshift-config Namespace，例如 oc create -f template.yaml -n openshift-config。"}, {"q": "Which parameter in the project template is replaced with the new project&#x27;s name?", "o": ["${PROJECT_NAME}", "${NAMESPACE}", "${REQUESTING_NAMESPACE}", "${PROJECT_ID}"], "a": 0, "e": "在 objects 清單中使用 ${PROJECT_NAME} 等變數；常見參數還有 PROJECT_DISPLAYNAME、PROJECT_DESCRIPTION、PROJECT_ADMIN_USER、PROJECT_REQUESTING_USER。"}, {"q": "When extracting resource definitions from a test namespace for a project template, what should you remove?", "o": ["The spec section", "All labels", "The kind and apiVersion fields", "Fields that do not apply to creating resources, such as creationTimestamp and status"], "a": 3, "e": "以 YAML 列出資源後，移除 creationTimestamp 與 status 等不適用欄位，並把 Namespace 名稱換成 ${PROJECT_NAME}。"}, {"q": "Which resource do you edit so that the cluster uses a custom project template?", "o": ["clusterversion/version", "oauth.config.openshift.io/cluster", "projects.config.openshift.io/cluster", "ingresscontroller/default"], "a": 2, "e": "修改 projects.config.openshift.io/cluster 的 spec.projectRequestTemplate.name，指定 Template 名稱 (預設為 project-request)。"}, {"q": "After you update the cluster project configuration, when do new projects include the custom template resources?", "o": ["After the apiserver Deployment in the openshift-apiserver namespace finishes rolling out", "Immediately", "After the next cluster update", "After <script>
const D=window.QUIZ, L='ABCD', KEY='do280-v422-'+D.id;
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){st={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const M=document.getElementById('qs');
D.q.forEach((q,i)=>{
  const s=document.createElement('section');s.className='q';s.id='q'+(i+1);
  s.innerHTML=`<h2><span class="n">Q${i+1}.</span><span lang="en">${q.q}</span></h2>
  <ul class="opts">${q.o.map((o,j)=>`<li><label><input type="radio" name="r${i}" value="${j}"><span class="k">${L[j]}.</span><span lang="en">${o}</span></label></li>`).join('')}</ul>
  <div class="act"><button class="btn primary show-ans">查看答案與說明</button><span class="badge"></span></div>
  <div class="ans"><div class="v"></div><p>${q.e}</p></div>`;
  M.appendChild(s);
  s.querySelectorAll('input').forEach(r=>r.addEventListener('change',()=>{st[i]={c:+r.value,r:st[i]&&st[i].r};save();paint(i,false)}));
  s.querySelector('.show-ans').addEventListener('click',()=>{st[i]=st[i]||{};st[i].r=1;save();paint(i,true)});
});
function paint(i,scroll){
  const q=D.q[i],s=document.getElementById('q'+(i+1)),x=st[i]||{};
  const labels=s.querySelectorAll('label');
  labels.forEach((lb,j)=>{lb.classList.remove('chosen','right','wrong');lb.querySelector('input').checked=(x.c===j);if(x.c===j)lb.classList.add('chosen')});
  const a=s.querySelector('.ans'),b=s.querySelector('.badge'),btn=s.querySelector('.show-ans');
  if(x.r){
    labels[q.a].classList.add('right');
    if(x.c!==undefined&&x.c!==q.a)labels[x.c].classList.add('wrong');
    a.classList.add('show');a.classList.toggle('x',x.c!==undefined&&x.c!==q.a);
    a.querySelector('.v').textContent=(x.c===undefined?'正確答案：':x.c===q.a?'答對了！正確答案：':'答錯了。正確答案：')+L[q.a]+'. '+strip(q.o[q.a]);
    b.textContent=x.c===undefined?'未作答':x.c===q.a?'✔ 正確':'✘ 錯誤';b.className='badge '+(x.c===q.a?'ok':x.c===undefined?'':'bad');
    btn.textContent='隱藏答案';btn.onclick=()=>{st[i].r=0;save();paint(i)};
  }else{
    a.classList.remove('show');b.textContent='';btn.textContent='查看答案與說明';
    btn.onclick=()=>{st[i]=st[i]||{};st[i].r=1;save();paint(i)};
  }
  stats();
}
function strip(h){const t=document.createElement('div');t.innerHTML=h;return t.textContent}
function stats(){
  let done=0,rev=0,ok=0;D.q.forEach((q,i)=>{const x=st[i]||{};if(x.c!==undefined)done++;if(x.r&&x.c!==undefined){rev++;if(x.c===q.a)ok++}});
  document.getElementById('done').textContent=done;document.getElementById('ok').textContent=ok;document.getElementById('rev').textContent=rev;
  document.querySelector('.prog i').style.width=(done/D.q.length*100)+'%';
}
document.getElementById('checkAll').onclick=()=>{
  D.q.forEach((q,i)=>{st[i]=st[i]||{};st[i].r=1});save();D.q.forEach((q,i)=>paint(i));
  let ok=0,un=0;D.q.forEach((q,i)=>{if(st[i].c===undefined)un++;else if(st[i].c===q.a)ok++});
  const s=document.getElementById('sum');s.classList.add('show');
  s.innerHTML=`<b>成績：${ok} / ${D.q.length} (${Math.round(ok/D.q.length*100)}%)</b><br>答錯 ${D.q.length-ok-un} 題，未作答 ${un} 題。可按「只看答錯」複習。`;
  try{const b=JSON.parse(localStorage.getItem('do280-v422-best')||'{}');if(!b[D.id]||ok>b[D.id]){b[D.id]=ok;localStorage.setItem('do280-v422-best',JSON.stringify(b))}}catch(e){}
  s.scrollIntoView({behavior:'smooth',block:'center'});
};
document.getElementById('reset').onclick=()=>{if(!confirmReset())return;st={};save();document.getElementById('sum').classList.remove('show');filt=0;applyFilter();D.q.forEach((q,i)=>paint(i));window.scrollTo(0,0)};
let armed=0;function confirmReset(){const b=document.getElementById('reset');if(armed){armed=0;b.textContent='重新作答';return true}armed=1;b.textContent='再按一次確認清除';setTimeout(()=>{armed=0;b.textContent='重新作答'},3000);return false}
let filt=0;document.getElementById('wrongOnly').onclick=()=>{filt=!filt;applyFilter()};
function applyFilter(){const b=document.getElementById('wrongOnly');b.textContent=filt?'顯示全部題目':'只看答錯';
  D.q.forEach((q,i)=>{const x=st[i]||{};const w=x.r&&x.c!==undefined&&x.c!==q.a;document.getElementById('q'+(i+1)).classList.toggle('hide',!!filt&&!w)})}
D.q.forEach((q,i)=>paint(i));
</script>
</body></html>
