<script>window.QUIZ={"id": "ch01", "q": [{"q": "Which management approach does Red Hat recommend for production workloads on OpenShift?", "o": ["Running a shell script of oc set commands", "Declarative management with resource manifests", "Imperative management with individual oc create commands", "Editing live resources directly in the web console"], "a": 1, "e": "簡報指出宣告式是正式環境的建議做法。Manifest 以 YAML 或 JSON 描述期望狀態，可放進版本控制、精確重現，並支援 GitOps；命令式則難以重現、沒有版本控制。"}, {"q": "What is a key disadvantage of the imperative workflow for production environments?", "o": ["It does not report any error messages", "It cannot create Deployments", "You must track and maintain a series of commands to reflect the desired state, which is hard to reproduce", "It always requires cluster-admin privileges"], "a": 2, "e": "命令式一次設定一個 Resource，長 Command-line 與零散的部署流程必須逐一追蹤維護，難以重現、沒有版本控制，也不支援 GitOps。它其實會針對元件回報明確的錯誤訊息，這反而是它適合開發測試的優點。"}, {"q": "Why is the imperative workflow considered useful during development and experimentation?", "o": ["It automatically stores every change in Git", "You can build one component at a time and test each step, with error messages specific to that component", "It supports GitOps out of the box", "It applies Kustomize overlays automatically"], "a": 1, "e": "命令式的好處是一個元件一個元件地建，每加一個就能測試，OpenShift 針對該元件回報明確的錯誤，像用除錯器逐行執行。"}, {"q": "In the MariaDB example, why does the db-pod Deployment fail to start after &#x27;oc create deployment db-pod --port 3306 --image ...&#x27;?", "o": ["Deployments cannot specify a port", "Required environment variables such as MYSQL_USER and MYSQL_PASSWORD are missing", "Port 3306 is reserved by OpenShift", "The image registry is unreachable"], "a": 1, "e": "範例中 Pod 因缺少 Environment Variables 而無法啟動，所以接著用 oc set env 補上 MYSQL_USER、MYSQL_PASSWORD 與 MYSQL_DATABASE。"}, {"q": "Which option makes &#x27;oc create deployment&#x27; output a YAML template without creating the resource on the cluster?", "o": ["--dry-run=client", "--dry-run=server", "--validate=true", "--save-config"], "a": 0, "e": "--dry-run=client 不在 Cluster 建立 Resource，只在本機輸出 YAML 範本；搭配 -o yaml 可導向檔案作為 Manifest 的起點。--dry-run=server 會把請求送到 Server。"}, {"q": "What does the --save-config option do when used with oc create?", "o": ["Stores the configuration in the kubectl.kubernetes.io/last-applied-configuration annotation for later use by oc apply", "Saves the YAML to the local home directory", "Commits the manifest to a Git repository", "Creates a ConfigMap with the deployment settings"], "a": 0, "e": "--save-config 會把設定存入 last-applied-configuration Annotation，之後 oc apply 比對三個來源時就會用到它。"}, {"q": "Which command shows the documentation for a specific resource field, such as a Deployment&#x27;s spec.replicas?", "o": ["oc get deployment --help-field replicas", "oc describe deployment.spec.replicas", "oc explain deployment.spec.replicas", "oc diff deployment.spec.replicas"], "a": 2, "e": "簡報提到 oc explain RESOURCE.FIELD 可查詢任一欄位的說明，適合撰寫 Manifest 時確認欄位用途。"}, {"q": "How can multiple resource manifests be stored in a single YAML file?", "o": ["Wrap all manifests in a JSON array only", "It is not possible; each resource needs its own file", "Separate each manifest with a line containing ---", "Separate each manifest with a blank line"], "a": 2, "e": "多個 Manifest 可放在同一個 YAML 檔，以 --- 分隔，例如一份 Deployment 加一份 Service。單檔或多檔只是組織上的偏好。"}, {"q": "Which option lets oc create -f process files in subdirectories of the specified directory?", "o": ["-r", "-k", "--all", "-R"], "a": 3, "e": "-R 選項會遞迴處理子目錄中的檔案。範例中 oc create -R -f ~/my-app 一次建立了根目錄的 Deployment 與 service 子目錄的 Service。-k 是 Kustomize 用的選項。"}, {"q": "What happens when you run &#x27;oc create -f&#x27; for a resource that already exists?", "o": ["The command reports an error", "The existing resource is deleted and recreated", "The command silently does nothing and exits successfully", "The existing resource is updated to match the file"], "a": 0, "e": "oc create -f 屬命令式，資源已存在時會回報錯誤；oc apply -f 則會比較現況與 Manifest，更新差異。"}, {"q": "Which statement best describes &#x27;oc apply -f&#x27;?", "o": ["It only deletes resources that are not in the manifest", "It is identical to oc replace --force", "It is declarative: it creates resources that do not exist and updates existing ones to match the manifest", "It only creates new resources and fails if they exist"], "a": 2, "e": "oc apply 是宣告式，會比較 Manifest 與 Cluster 現況，既能建立也能更新資源，因此適合持續維護的應用程式。"}, {"q": "Which three sources does oc apply compare to decide how to update a resource?", "o": ["The kubeconfig file, the manifest file, and the project template", "The manifest file, the live resource configuration, and the last-applied-configuration annotation", "The manifest file, the Git history, and the etcd backup", "The live resource, the cluster version, and the image digest"], "a": 1, "e": "oc apply 同時比較 Manifest (期望狀態)、Cluster 裡的 Live 設定，以及存在 Annotation 中的上次套用內容，而不是單純覆蓋 Live Resource。"}, {"q": "A field exists in the last-applied-configuration annotation but has been removed from the manifest. What does oc apply do?", "o": ["Keeps the field unchanged in the live configuration", "Fails with a conflict error", "Removes the field from the live configuration", "Adds the field back to the manifest file"], "a": 2, "e": "上次套用的內容有、但 Manifest 已經沒有的欄位，oc apply 會把它從 Live 設定移除，完成後再更新 Annotation 供下次比對。"}, {"q": "What does &#x27;oc apply --dry-run=server&#x27; do?", "o": ["Only prints the object locally without contacting the server", "Creates the resource and then immediately deletes it", "Validates YAML indentation only", "Sends the request to the server to check it against current server policies without creating the resource"], "a": 3, "e": "--dry-run=server 會把請求送到 Server，確認符合目前的政策，但不建立 Resource。"}, {"q": "Why can a manifest pass &#x27;--dry-run=client&#x27; but still be rejected by the cluster?", "o": ["Client dry-run removes all labels", "Client dry-run only outputs the object that would be sent; it does not check it against server policies", "Client dry-run requires cluster-admin rights", "Client dry-run uses an older API version"], "a": 1, "e": "--dry-run=client 只輸出將送往 Server 的物件，YAML 語法正確仍可能被 Cluster 拒絕，因此正式套用前建議用 --dry-run=server。"}, {"q": "What does &#x27;--validate=true&#x27; do when applying a manifest?", "o": ["Validates network connectivity to the API server", "Validates that the image exists in the registry", "Validates the user&#x27;s RBAC permissions only", "Validates the input against the schema and fails the request if it is invalid"], "a": 3, "e": "--validate=true 以 Schema 驗證輸入，無效時讓請求失敗。簡報建議與 --dry-run=server 一起使用。"}, {"q": "Compared to a generic text diff tool, what is an advantage of &#x27;oc diff -f FILE&#x27;?", "o": ["It shows every whitespace change in the file", "It shows only differences that have a material effect on the cluster and masks Secret values", "It automatically applies the changes", "It compares two local files without contacting the cluster"], "a": 1, "e": "oc diff 只顯示對 Cluster 有實質影響的差異 (例如 generation 由 1 變 2、Image Tag 變更)，雜訊少，而且會遮蔽 Secret 的值。"}, {"q": "How do GitOps tools use oc diff?", "o": ["To generate Kustomize overlays", "To render Helm templates", "To encrypt Secrets before committing", "To detect whether someone changed a resource outside of the GitOps workflow"], "a": 3, "e": "簡報指出 GitOps 工具依賴 oc diff 判斷是否有人在 GitOps 流程之外變更了 Resource。"}, {"q": "You update a Secret with oc apply, but the Deployment that uses it is unchanged. What happens to the running pods?", "o": ["They receive the new values immediately through the API", "They restart automatically within one minute", "They are deleted and not recreated", "They keep using the old Secret values because pods read Secrets only at startup"], "a": 3, "e": "Deployment 本身沒有變更就不會產生新 Pod；Pod 只在啟動時讀取 Secret 與 ConfigMap，所以會繼續使用舊值。"}, {"q": "In the guided exercise version v1.1.1, why does the exoplanets pod enter CrashLoopBackOff?", "o": ["The exoplanets image tag does not exist", "The database Deployment did not restart, so it still used the old Secret values while exoplanets used the new ones", "The project quota was exceeded", "The route was deleted"], "a": 1, "e": "v1.1.1 同時改了 Image 與兩個 Secret。exoplanets 的 Deployment 改變所以重建 Pod，但 database Deployment 沒變而未重啟，兩邊設定不一致，exoplanets 因此 CrashLoopBackOff。"}, {"q": "Which command fixes pods that still use outdated Secret values, with minimal downtime for multiple replicas?", "o": ["oc scale deployment/NAME --replicas=0", "oc rollout restart deployment/NAME", "oc delete project NAME", "oc apply -f . --force"], "a": 1, "e": "對 Deployment 執行滾動重啟，Pod 會逐步停止與取代，停機時間最少。單一 Replica 時也可直接刪除 Pod，但多 Replica 建議滾動重啟。"}, {"q": "What does &#x27;oc patch&#x27; do?", "o": ["Updates or adds fields of an existing object based on a JSON or YAML snippet or file", "Creates a new object from a template", "Rolls back a Deployment to the previous revision", "Replaces the entire object with a new manifest"], "a": 0, "e": "oc patch 依據 JSON 或 YAML 的片段或檔案，更新或新增既有物件的欄位，只修改指定的欄位，而且可以重複執行。"}, {"q": "Which oc patch option supplies the patch content from a YAML file?", "o": ["-k", "-f", "--patch-file", "--from-file"], "a": 2, "e": "--patch-file 指定 YAML 修補檔的位置；-p 則直接在 Command-line 帶入 JSON 片段。"}, {"q": "What does this command do? oc patch deployment hello -p &#x27;{&quot;spec&quot;:{&quot;template&quot;:{&quot;spec&quot;:{&quot;containers&quot;:[{&quot;name&quot;:&quot;hello-rhel10&quot;,&quot;resources&quot;:{&quot;requests&quot;:{&quot;cpu&quot;:&quot;100m&quot;}}}]}}}}&#x27;", "o": ["Sets the CPU request of the hello-rhel10 container to 100m", "Creates a new container named hello-rhel10 with 100 MiB of memory", "Sets the CPU limit of the deployment to 100 cores", "Scales the deployment to 100 replicas"], "a": 0, "e": "這是以 -p 帶入 JSON 片段的範例，把 hello Deployment 中 hello-rhel10 Container 的 CPU request 設為 100m (100 millicore)。"}, {"q": "A patch file adds a volumeMount that may or may not already exist in the Deployment. How does oc patch behave?", "o": ["It adds the field if it does not exist and modifies it if it does", "It fails if the field does not exist", "It fails if the field already exists", "It duplicates the field"], "a": 0, "e": "oc patch 的套用行為是欄位不存在則新增、已存在則修改，所以無論 Deployment 是否已有該 Volume Mount 都能執行。"}, {"q": "In the PVC patch example, what changes after patching the hello Deployment&#x27;s www volume?", "o": ["The claim changes from deprecated-www to nginx-www and the mount path changes to the nginx html directory", "A second volume named www-2 is added", "The Deployment is converted to a StatefulSet", "The tls-conf ConfigMap mount is removed"], "a": 0, "e": "套用修補檔後，同一個 www Volume 的 claim 改為 nginx-www，Mount 路徑改為 /usr/share/nginx/html/；tls-conf ConfigMap 的 Mount 完全不受影響。"}, {"q": "What is Kustomize?", "o": ["A declarative configuration management tool that customizes base YAML through overlays without modifying the original files", "An imperative CLI that replaces oc", "A web console plug-in for editing YAML", "A package manager that installs charts from repositories"], "a": 0, "e": "Kustomize 是宣告式設定管理工具，保留原始 base YAML，以 overlay 套用各環境差異而不修改原檔。oc 與 kubectl 都已整合 Kustomize。"}, {"q": "What file must exist in a directory for Kustomize to process it?", "o": ["Chart.yaml", "values.yaml", "kustomization.yaml", "template.yaml"], "a": 2, "e": "Kustomize 以含 kustomization.yaml 的目錄運作。Chart.yaml 與 values.yaml 是 Helm Chart 的檔案。"}, {"q": "In a Kustomize layout, what is the role of an overlay directory?", "o": ["It stores Helm release secrets", "It stores the shared resources used by every environment", "It contains the compiled container images", "It points to one or more bases and applies environment-specific patches and settings"], "a": 3, "e": "overlay 目錄有自己的 kustomization.yaml，指向一個或多個 base，用 patch 覆寫該環境的設定；共用的 Resource 放在 base。"}, {"q": "In a base kustomization.yaml, which field lists the resource files to include?", "o": ["resources", "bases", "files", "patches"], "a": 0, "e": "base 的 kustomization.yaml 以 resources 列出所有資源檔 (configmap.yaml、deployment.yaml 等)；overlay 也用 resources 指向 ../../base。"}, {"q": "An overlay kustomization.yaml sets &#x27;namespace: dev-env&#x27;. What is the effect?", "o": ["A new project template named dev-env is created", "Only Deployments are created in dev-env", "The base directory is renamed to dev-env", "All resources are set to the dev-env namespace"], "a": 3, "e": "namespace 欄位為所有 Resource 設定指定的 Namespace，使該 overlay 的資源全部建立在 dev-env。"}, {"q": "Which Kustomize field adds a prefix to the names of all resources?", "o": ["labels", "nameSuffix", "namePrefix", "commonAnnotations"], "a": 2, "e": "namePrefix 為所有 Resource 名稱加前綴，nameSuffix 加後綴；labels 與 commonAnnotations 則加 Label 與 Annotation。"}, {"q": "Which Kustomize field is deprecated and should be replaced by &#x27;labels&#x27; with &#x27;pairs&#x27;?", "o": ["commonLabels", "namePrefix", "commonAnnotations", "resources"], "a": 0, "e": "commonLabels 為已棄用欄位，新檔案應改用 labels 搭配 pairs 設定 Label。"}, {"q": "Where is the &#x27;kustomize edit fix&#x27; command available?", "o": ["In both oc and kubectl", "Only in the standalone kustomize program; oc and kubectl do not include it", "In oc but not kubectl", "Only in the OpenShift web console"], "a": 1, "e": "簡報指出 kustomize edit fix 僅限獨立的 kustomize 程式，oc 與 kubectl 未整合此功能。"}, {"q": "What two elements make up an entry in the Kustomize &#x27;patches&#x27; field?", "o": ["op and value", "patch and target", "base and overlay", "source and destination"], "a": 1, "e": "patches 機制由 patch 與 target 組成：patch 描述修改內容，target 指定要套用的資源 (例如 kind: Deployment、name: frontend)。"}, {"q": "Which patch format uses &#x27;op&#x27;, &#x27;path&#x27;, and &#x27;value&#x27; to describe individual operations?", "o": ["JSON Patch", "Helm values override", "Strategic merge patch", "Template parameter file"], "a": 0, "e": "JSON Patch 以操作類型、路徑與值指定個別操作，例如 op: replace、path: /spec/replicas、value: 15。"}, {"q": "Which patch format uses the same YAML structure as the target resource and merges the specified fields?", "o": ["Strategic merge patch", "JSON Patch", "Kustomize generator", "oc process parameter file"], "a": 0, "e": "Strategic Merge Patch 使用與目標資源相同的 YAML 結構合併欄位，例如 production 範例的 patch.yaml 把名稱改為 frontend-prod、replicas 改為 5。"}, {"q": "The production overlay patch changes the Deployment name to frontend-prod. Which option must be set in the patch entry?", "o": ["disableNameSuffixHash: true", "namePrefix: prod-", "allowKindChange: true", "allowNameChange: true"], "a": 3, "e": "因為 patch 要變更資源名稱，所以 options 須設定 allowNameChange: true。"}, {"q": "In Kustomize v5, which older fields are deprecated and replaced by &#x27;patches&#x27;?", "o": ["namespace and namePrefix", "patchesJson6902 and patchesStrategicMerge", "resources and bases", "configMapGenerator and secretGenerator"], "a": 1, "e": "舊的 PatchesJson6902 與 PatchesStrategicMerge 在 Kustomize 第五版已棄用，統一由 patches 取代，但內容格式沿用。"}, {"q": "Which command renders the final manifests of a kustomization without applying them to the cluster?", "o": ["oc diff -R DIR", "oc create -k DIR", "oc apply -k DIR", "oc kustomize DIR"], "a": 3, "e": "oc kustomize DIR 渲染並輸出最終 Manifest，不套用到 Cluster，可先確認名稱、Replica 數與 Label 是否正確。"}, {"q": "Which command validates a rendered kustomization against the cluster without creating resources?", "o": ["oc process -k DIR", "oc apply -f DIR --dry-run=client", "oc apply -k DIR --dry-run=server", "oc kustomize DIR --validate"], "a": 2, "e": "oc apply -k DIR --dry-run=server 會向 Cluster 驗證渲染結果，但不建立 Resource。"}, {"q": "Which command deletes the resources that were deployed by a kustomization?", "o": ["oc kustomize DIR --delete", "oc delete -k DIR", "oc delete -f kustomization.yaml", "oc rollout undo -k DIR"], "a": 1, "e": "oc delete -k DIR 會刪除由 Kustomize 部署的 Resource，包含 ConfigMap、Secret、Service 與 Deployment。"}, {"q": "Why do configMapGenerator and secretGenerator append a hash to the generated resource name?", "o": ["To make the name unique across all clusters", "To prevent the resource from being deleted", "To encrypt the data", "When the content changes, the name changes, so the referencing Deployment changes and triggers a rolling update"], "a": 3, "e": "Generator 在名稱後加 hash，內容一變 hash 就變，Deployment 參照的名稱隨之改變，因此觸發 Rolling Update，不需手動重啟。"}, {"q": "In a configMapGenerator, what does the &#x27;files&#x27; source produce?", "o": ["Each line of the file becomes a separate key", "The file is mounted as a volume automatically", "The whole file becomes a single key, such as application.properties", "The file is base64-encoded into a Secret"], "a": 2, "e": "files 會把整個檔案內容放成一個 key；envs 才是把環境檔中每個變數變成獨立的 key。"}, {"q": "In a configMapGenerator, what does the &#x27;envs&#x27; source produce?", "o": ["A Secret instead of a ConfigMap", "Each variable in the env file becomes a separate key", "Environment variables are injected into every pod", "The whole env file becomes one key"], "a": 1, "e": "envs 會把環境檔中每一個變數變成獨立的 key；literals 則直接以 key=value 指定內容。"}, {"q": "What does secretGenerator do in addition to what configMapGenerator does?", "o": ["Performs the base64 encoding that Secrets require", "Stores the data in an external vault", "Encrypts the data with a cluster key", "Creates a service account"], "a": 0, "e": "secretGenerator 用法與 configMapGenerator 相同，另外會處理 Secret 所需的 base64 編碼。"}, {"q": "When is it appropriate to set &#x27;disableNameSuffixHash: true&#x27; in generatorOptions?", "o": ["When the ConfigMap is larger than 1 MiB", "When you want every change to trigger a rollout", "When using JSON Patch", "When a component, such as the OpenShift OAuth operator, applies changes to the Secret by itself"], "a": 3, "e": "預設附加 hash 以觸發 Rollout；但像 OpenShift OAuth Operator 會自動套用 htpasswd Secret 的變更，這時可在 generatorOptions 停用 hash 後綴。"}, {"q": "Besides disabling the name hash, what else can generatorOptions set on generated resources?", "o": ["Image tags", "Replica counts", "Labels and annotations", "Resource quotas"], "a": 2, "e": "generatorOptions 可停用 hash 後綴，並替產生的資源加上 labels 與 annotations。"}, {"q": "In the Kustomize guided exercise, what happens when DB_PASSWORD changes to newpassword in version v1.1.2?", "o": ["The production overlay is deleted", "The existing Secret is edited and the pods keep the old value", "Kustomize creates a new db-secrets Secret and both Deployments switch to it", "The application fails with CrashLoopBackOff"], "a": 2, "e": "因為使用 secretGenerator，內容改變就產生新的 db-secrets (新 hash)，兩個 Deployment 改用新 Secret 並重新部署，應用程式維持正常，不需手動重啟。"}, {"q": "In the lab, which command deploys the production overlay that sets two replicas?", "o": ["oc kustomize overlays/production", "oc create -k base", "oc apply -f overlays/production/patch-replicas.yaml", "oc apply -k overlays/production"], "a": 3, "e": "Lab 在 declarative-review-production Project 執行 oc apply -k overlays/production，套用以 patch-replicas.yaml 將 replicas 設為 2 的 overlay。oc kustomize 只渲染不套用。"}]};</script>
<script>
const D=window.QUIZ, L='ABCD', KEY='do280-v422-'+D.id;
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){st={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const M=document.getElementById('qs');
D.q.forEach((q,i)=>{
  const s=document.createElement('section');s.className='q';s.id='q'+(i+1);
  s.innerHTML=`<h2><span class="n">Q${i+1}.</span><span lang="en">${q.q}</span></h2>
  <ul class="opts">${q.o.map((o,j)=>`<li><label><input type="radio" name="r${i}" value="${j}"><span class="k">${L[j]}.</span><span lang="en">${o}</span></label></li>`).join('')}</ul>
  <div class="act"><button class="btn primary show-ans">查看答案與說明</button><span class="badge"></span></div>
  <div class="ans"><div class="v"></div><p>${q.e}</p></div>`;
  M.appendChild(s);
  s.querySelectorAll('input').forEach(r=>r.addEventListener('change',()=>{st[i]={c:+r.value,r:st[i]&&st[i].r};save();paint(i,false)}));
  s.querySelector('.show-ans').addEventListener('click',()=>{st[i]=st[i]||{};st[i].r=1;save();paint(i,true)});
});
function paint(i,scroll){
  const q=D.q[i],s=document.getElementById('q'+(i+1)),x=st[i]||{};
  const labels=s.querySelectorAll('label');
  labels.forEach((lb,j)=>{lb.classList.remove('chosen','right','wrong');lb.querySelector('input').checked=(x.c===j);if(x.c===j)lb.classList.add('chosen')});
  const a=s.querySelector('.ans'),b=s.querySelector('.badge'),btn=s.querySelector('.show-ans');
  if(x.r){
    labels[q.a].classList.add('right');
    if(x.c!==undefined&&x.c!==q.a)labels[x.c].classList.add('wrong');
    a.classList.add('show');a.classList.toggle('x',x.c!==undefined&&x.c!==q.a);
    a.querySelector('.v').textContent=(x.c===undefined?'正確答案：':x.c===q.a?'答對了！正確答案：':'答錯了。正確答案：')+L[q.a]+'. '+strip(q.o[q.a]);
    b.textContent=x.c===undefined?'未作答':x.c===q.a?'✔ 正確':'✘ 錯誤';b.className='badge '+(x.c===q.a?'ok':x.c===undefined?'':'bad');
    btn.textContent='隱藏答案';btn.onclick=()=>{st[i].r=0;save();paint(i)};
  }else{
    a.classList.remove('show');b.textContent='';btn.textContent='查看答案與說明';
    btn.onclick=()=>{st[i]=st[i]||{};st[i].r=1;save();paint(i)};
  }
  stats();
}
function strip(h){const t=document.createElement('div');t.innerHTML=h;return t.textContent}
function stats(){
  let done=0,rev=0,ok=0;D.q.forEach((q,i)=>{const x=st[i]||{};if(x.c!==undefined)done++;if(x.r&&x.c!==undefined){rev++;if(x.c===q.a)ok++}});
  document.getElementById('done').textContent=done;document.getElementById('ok').textContent=ok;document.getElementById('rev').textContent=rev;
  document.querySelector('.prog i').style.width=(done/D.q.length*100)+'%';
}
document.getElementById('checkAll').onclick=()=>{
  D.q.forEach((q,i)=>{st[i]=st[i]||{};st[i].r=1});save();D.q.forEach((q,i)=>paint(i));
  let ok=0,un=0;D.q.forEach((q,i)=>{if(st[i].c===undefined)un++;else if(st[i].c===q.a)ok++});
  const s=document.getElementById('sum');s.classList.add('show');
  s.innerHTML=`<b>成績：${ok} / ${D.q.length} (${Math.round(ok/D.q.length*100)}%)</b><br>答錯 ${D.q.length-ok-un} 題，未作答 ${un} 題。可按「只看答錯」複習。`;
  try{const b=JSON.parse(localStorage.getItem('do280-v422-best')||'{}');if(!b[D.id]||ok>b[D.id]){b[D.id]=ok;localStorage.setItem('do280-v422-best',JSON.stringify(b))}}catch(e){}
  s.scrollIntoView({behavior:'smooth',block:'center'});
};
document.getElementById('reset').onclick=()=>{if(!confirmReset())return;st={};save();document.getElementById('sum').classList.remove('show');filt=0;applyFilter();D.q.forEach((q,i)=>paint(i));window.scrollTo(0,0)};
let armed=0;function confirmReset(){const b=document.getElementById('reset');if(armed){armed=0;b.textContent='重新作答';return true}armed=1;b.textContent='再按一次確認清除';setTimeout(()=>{armed=0;b.textContent='重新作答'},3000);return false}
let filt=0;document.getElementById('wrongOnly').onclick=()=>{filt=!filt;applyFilter()};
function applyFilter(){const b=document.getElementById('wrongOnly');b.textContent=filt?'顯示全部題目':'只看答錯';
  D.q.forEach((q,i)=>{const x=st[i]||{};const w=x.r&&x.c!==undefined&&x.c!==q.a;document.getElementById('q'+(i+1)).classList.toggle('hide',!!filt&&!w)})}
D.q.forEach((q,i)=>paint(i));
</script>
</body></html>
